name: dunia_anak_ceria
description: "Interactive Kids Launcher & Learning App for 1-5 Years Old"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Audio & Multimedia
  audioplayers: ^6.0.0
  flutter_tts: ^4.2.0
  record: ^5.1.2
  path_provider: ^2.1.3

  # UI, Fonts & Responsiveness
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # State Management & Storage
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  image_picker: ^1.2.2

dependency_overrides:
  record_linux: 1.3.1
  record_platform_interface: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# Konfigurasi Auto-Generate App Icon
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FBBF24"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/audio/sfx/
    - assets/audio/animals/
    - assets/audio/vehicles/
    - assets/images/animals/
    - assets/images/vehicles/
    - assets/images/fruits/
    - assets/stories/
    - assets/images/stories/
    - assets/images/stories/somat_pisang/
    - assets/audio/stories/somat_pisang/
    - assets/images/stories/milo_kue_pisang/
    - assets/audio/stories/milo_kue_pisang/
