<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dunia Anak Ceria - Kids Launcher</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Nunito for friendly kid-style typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: linear-gradient(180deg, #60A5FA 0%, #93C5FD 50%, #86EFAC 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-num {
      font-family: 'Nunito', sans-serif;
    }
    /* Floating Cloud Animations */
    @keyframes floatSlow {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(120vw); }
    }
    .cloud-anim-1 { animation: floatSlow 28s linear infinite; }
    .cloud-anim-2 { animation: floatSlow 38s linear infinite 14s; }
    
    /* Wobble & Bounce effects */
    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }
    .bounce-card {
      animation: gentleBounce 3.5s ease-in-out infinite;
    }
    .active-press:active {
      transform: scale(0.92) translateY(4px);
      filter: brightness(0.95);
    }
    /* Pulse for recording */
    @keyframes pulseRecord {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .recording-pulse {
      animation: pulseRecord 1.4s infinite;
    }
    /* Ripple & pulse for stage card */
    @keyframes stageGlow {
      0%, 100% { box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.2), 0 8px 10px -6px rgba(59, 130, 246, 0.2); }
      50% { box-shadow: 0 20px 35px -5px rgba(245, 158, 11, 0.35), 0 12px 16px -6px rgba(245, 158, 11, 0.3); }
    }
    .stage-card-glow {
      animation: stageGlow 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 text-slate-800">

  <!-- Mobile Device Frame Container -->
  <div class="relative w-full max-w-md h-[100dvh] sm:h-[860px] bg-sky-200 sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden border-0 sm:border-8 border-yellow-400">
    
    <!-- Background Animated Clouds -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-0 opacity-40">
      <div class="absolute top-8 cloud-anim-1">
        <svg class="w-24 h-12 text-white fill-current" viewBox="0 0 100 50">
          <path d="M20 40 Q20 20 40 20 Q50 5 70 20 Q90 20 90 40 Z"/>
        </svg>
      </div>
      <div class="absolute top-28 cloud-anim-2">
        <svg class="w-32 h-16 text-white fill-current" viewBox="0 0 100 50">
          <path d="M20 40 Q20 15 45 18 Q60 2 80 18 Q95 20 95 40 Z"/>
        </svg>
      </div>
    </div>

    <!-- Top Safe Area / Kiosk Status Bar -->
    <header class="relative z-20 flex items-center justify-between px-4 pt-3 pb-2 bg-white/70 backdrop-blur-md rounded-b-3xl shadow-sm border-b-2 border-yellow-300">
      <div class="flex items-center space-x-2">
        <div class="w-10 h-10 rounded-full bg-amber-400 border-2 border-white flex items-center justify-center text-xl shadow">
          ⭐
        </div>
        <div>
          <span class="text-xs font-bold text-sky-800 tracking-wide uppercase">Dunia Ceria</span>
          <h1 class="text-lg font-black text-amber-500 leading-tight">Halo, Bintang Kecil!</h1>
        </div>
      </div>

      <!-- Parental Control / Exit Kiosk Button -->
      <button onclick="openParentalLock()" class="px-3 py-1.5 rounded-2xl bg-amber-100 hover:bg-amber-200 border-2 border-amber-400 active-press flex items-center space-x-1 text-amber-800 font-bold text-xs shadow-sm" title="Zona Orang Tua">
        <span>🛡️</span>
        <span class="hidden xs:inline">Orang Tua</span>
      </button>
    </header>

    <!-- MAIN SCENE SWITCHER (App Views) -->
    <main id="appContent" class="relative z-10 flex-1 overflow-y-auto px-4 py-3 flex flex-col">
      <!-- Views will be dynamically swapped here -->
    </main>

    <!-- Bottom Friendly Navigation Bar (Compact & Ergonomic 4 Buttons) -->
    <nav class="relative z-20 px-4 py-2 bg-white/95 rounded-t-3xl shadow-lg border-t-4 border-amber-300 flex justify-between items-center">
      <button onclick="switchView('home')" id="nav-home" class="nav-item flex flex-col items-center flex-1 py-1 px-2 rounded-2xl transition active-press text-amber-500">
        <span class="text-2xl">🏠</span>
        <span class="text-[11px] font-black mt-0.5">Beranda</span>
      </button>

      <button onclick="switchView('learn_hub')" id="nav-learn_hub" class="nav-item flex flex-col items-center flex-1 py-1 px-2 rounded-2xl transition active-press text-slate-500">
        <span class="text-2xl">🎒</span>
        <span class="text-[11px] font-black mt-0.5">Belajar</span>
      </button>

      <button onclick="switchView('video')" id="nav-video" class="nav-item flex flex-col items-center flex-1 py-1 px-2 rounded-2xl transition active-press text-slate-500">
        <span class="text-2xl">🎬</span>
        <span class="text-[11px] font-black mt-0.5">Kartun</span>
      </button>

      <button onclick="switchView('mimic')" id="nav-mimic" class="nav-item flex flex-col items-center flex-1 py-1 px-2 rounded-2xl transition active-press text-slate-500">
        <span class="text-2xl">🎙️</span>
        <span class="text-[11px] font-black mt-0.5">Suaraku</span>
      </button>
    </nav>

    <!-- Parental Gate Modal -->
    <div id="parentalModal" class="hidden absolute inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl border-4 border-amber-400 text-center relative">
        <div class="w-14 h-14 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl border-2 border-amber-300">
          🔒
        </div>
        <h3 class="text-xl font-bold text-slate-800 mb-1">Zona Orang Tua</h3>
        <p class="text-xs text-slate-600 mb-4" id="parentalMathQuestion">Selesaikan perhitungan berikut untuk membuka pengaturan:</p>
        
        <div class="bg-amber-50 py-3 rounded-2xl text-2xl font-black text-amber-600 mb-4 tracking-wider" id="mathDisplay">
          3 + 5 = ?
        </div>

        <input type="number" id="parentalInput" placeholder="Jawaban..." class="w-full text-center text-xl font-bold p-3 border-2 border-slate-300 rounded-2xl focus:border-amber-500 focus:outline-none mb-4">

        <div class="flex space-x-2">
          <button onclick="closeParentalLock()" class="flex-1 py-2.5 rounded-2xl bg-slate-200 text-slate-700 font-bold active-press">Batal</button>
          <button onclick="verifyParentalLock()" class="flex-1 py-2.5 rounded-2xl bg-amber-500 text-white font-bold active-press shadow-md hover:bg-amber-600">Buka</button>
        </div>
        <p id="parentalError" class="text-xs text-red-500 font-bold mt-2 hidden">Jawaban belum tepat, yuk coba lagi!</p>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="hidden absolute top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-emerald-500 text-white font-black text-sm rounded-full shadow-lg border-2 border-white transition-all duration-300">
      Bagus Sekali! ⭐
    </div>
  </div>

  <script>
    /* =========================================================================
       1. OFFLINE-FIRST SOUND ENGINE (Web Audio API Synthesizer)
       Tidak membutuhkan download file MP3 eksternal, 100% aman offline!
       ========================================================================= */
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Nada Riang & Feedback Tombol
    function playTone(freq = 440, type = 'sine', duration = 0.2, volume = 0.25) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn('Audio error:', e);
      }
    }

    // Melodi Kemenangan Bintang
    function playRewardJingle() {
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((f, index) => {
        setTimeout(() => playTone(f, 'triangle', 0.28, 0.3), index * 110);
      });
      showToast("Hebat Banget! 🌟");
    }

    // Suara Hewan Berbasis Sintesis Web Audio
    function playAnimalSound(type) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      // Realistic synthesizer using formant filters, noise buffers & multi-oscillator layers
      if (type === 'cat') {
        // Kucing: Meong dengan dua harmonik vokal (F1/F2) dan modulasi amplitudo halus
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc1.type = 'sawtooth';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(450, now);
        osc2.frequency.setValueAtTime(900, now);

        // Infleksi vokal "Meee-oow" (naik lalu turun)
        osc1.frequency.linearRampToValueAtTime(720, now + 0.3);
        osc1.frequency.exponentialRampToValueAtTime(320, now + 0.95);
        osc2.frequency.linearRampToValueAtTime(1440, now + 0.3);
        osc2.frequency.exponentialRampToValueAtTime(640, now + 0.95);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1100, now);
        filter.frequency.linearRampToValueAtTime(1800, now + 0.3);
        filter.frequency.linearRampToValueAtTime(700, now + 0.95);
        filter.Q.value = 3.5;

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 0.18);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.96);
        osc2.stop(now + 0.96);

      } else if (type === 'dog') {
        // Anjing: Salakan berenergi dengan noise serak & hentakan dada
        [0, 0.24].forEach((offset) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const filter = ctx.createBiquadFilter();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(340, now + offset);
          osc.frequency.exponentialRampToValueAtTime(80, now + offset + 0.17);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(850, now + offset);
          filter.frequency.exponentialRampToValueAtTime(250, now + offset + 0.17);

          gain.gain.setValueAtTime(0.45, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.17);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + offset);
          osc.stop(now + offset + 0.18);
        });

      } else if (type === 'cow') {
        // Sapi: Lenguhan dalam (Moo) dengan vibrato laring
        const osc = ctx.createOscillator();
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.linearRampToValueAtTime(145, now + 0.35);
        osc.frequency.exponentialRampToValueAtTime(90, now + 1.4);

        lfo.frequency.setValueAtTime(4.5, now);
        lfoGain.gain.setValueAtTime(6, now);
        lfo.connect(osc.frequency);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(420, now);
        filter.frequency.linearRampToValueAtTime(650, now + 0.3);
        filter.frequency.linearRampToValueAtTime(300, now + 1.4);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.4, now + 0.25);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        lfo.start(now);
        osc.start(now);
        lfo.stop(now + 1.42);
        osc.stop(now + 1.42);

      } else if (type === 'sheep') {
        // Domba: Embikan dengan getaran bibir cepat (15Hz vibrato)
        const osc = ctx.createOscillator();
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(290, now);
        osc.frequency.linearRampToValueAtTime(260, now + 0.85);

        lfo.frequency.setValueAtTime(15, now);
        lfoGain.gain.setValueAtTime(28, now);
        lfo.connect(osc.frequency);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(950, now);
        filter.Q.value = 2.2;

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        lfo.start(now);
        osc.start(now);
        lfo.stop(now + 0.86);
        osc.stop(now + 0.86);

      } else if (type === 'frog') {
        // Katak: Kwek serak tenggorokan dua ketukan
        [0, 0.22].forEach(offset => {
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();

          osc.type = 'square';
          osc.frequency.setValueAtTime(160, now + offset);
          osc.frequency.linearRampToValueAtTime(240, now + offset + 0.08);

          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(620, now + offset);
          filter.Q.value = 4.0;

          gain.gain.setValueAtTime(0.4, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.15);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + offset);
          osc.stop(now + offset + 0.16);
        });

      } else if (type === 'rooster') {
        // Ayam: Ku-ku-ru-yuuuk nada berundak naik
        const pitches = [390, 480, 580, 720];
        const times = [0, 0.11, 0.24, 0.42];
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        pitches.forEach((p, idx) => {
          osc.frequency.setValueAtTime(p, now + times[idx]);
        });
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1300, now);
        filter.Q.value = 2.8;

        gain.gain.setValueAtTime(0.38, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.05);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 1.06);

      } else if (type === 'elephant') {
        // Gajah: Tiupan belalai resonan dengan filter sweep
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(840, now + 0.35);
        osc.frequency.exponentialRampToValueAtTime(310, now + 0.95);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(900, now);
        filter.frequency.linearRampToValueAtTime(1700, now + 0.35);
        filter.frequency.linearRampToValueAtTime(650, now + 0.95);
        filter.Q.value = 5.0;

        gain.gain.setValueAtTime(0.38, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.95);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.96);

      } else if (type === 'monkey') {
        // Monyet: Pekikan U-U-A-A melompat-lompat
        [0, 0.16, 0.34].forEach((offset, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(idx === 0 ? 520 : (idx === 1 ? 780 : 920), now + offset);
          gain.gain.setValueAtTime(0.35, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.13);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.14);
        });

      } else if (type === 'duck') {
        // Bebek: Kwek sengau tajam
        [0, 0.23].forEach((offset) => {
          const osc = ctx.createOscillator();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(390, now + offset);
          osc.frequency.linearRampToValueAtTime(260, now + offset + 0.17);

          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1150, now + offset);
          filter.Q.value = 4.2;

          gain.gain.setValueAtTime(0.35, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.17);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + offset);
          osc.stop(now + offset + 0.18);
        });

      } else if (type === 'lion' || type === 'tiger') {
        // Singa / Harimau: Raungan berat dengan sub-bass dan white noise serak
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(65, now + 1.1);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(360, now);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.5, now + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.1);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 1.15);

      } else if (type === 'horse') {
        // Kuda: Ringkikan tinggi bergetar (Whinny)
        const osc = ctx.createOscillator();
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.linearRampToValueAtTime(1050, now + 0.25);
        osc.frequency.linearRampToValueAtTime(520, now + 0.9);

        lfo.frequency.setValueAtTime(16, now);
        lfoGain.gain.setValueAtTime(35, now);
        lfo.connect(osc.frequency);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.38, now + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.9);

        osc.connect(gain);
        gain.connect(ctx.destination);

        lfo.start(now);
        osc.start(now);
        lfo.stop(now + 0.92);
        osc.stop(now + 0.92);

      } else if (type === 'bee') {
        // Lebah: Dengungan sayap bzzzz berosilasi cepat
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(210, now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.95);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.96);

      } else if (type === 'owl') {
        // Burung Hantu: Hu-huuu lembut di malam hari
        [0, 0.35].forEach((offset) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(410, now + offset);
          osc.frequency.exponentialRampToValueAtTime(260, now + offset + 0.25);
          gain.gain.setValueAtTime(0.32, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.26);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.27);
        });

      } else if (type === 'dolphin') {
        // Lumba-lumba: Rangkaian sonar klik & siul ultrasonik
        [0, 0.08, 0.16, 0.24, 0.32].forEach(offset => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1500, now + offset);
          osc.frequency.exponentialRampToValueAtTime(2400, now + offset + 0.06);
          gain.gain.setValueAtTime(0.28, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.07);
        });

      } else if (type === 'rabbit') {
        // Kelinci: Nada lompat hop-hop lucu
        [0, 0.14, 0.28].forEach((offset, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540 + (idx * 210), now + offset);
          gain.gain.setValueAtTime(0.32, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.11);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.12);
        });
      }
    }

    // Suara Kendaraan Realistis
    function playVehicleSound(type) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

    // Suara Speech Fonik Menggunakan Web Speech API (Local TTS)
    // Diperlambat secara default ke rate 0.62 agar sangat jelas bagi balita
    function speakWord(text, rate = 0.62) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop prev speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        utterance.rate = rate; // Sangat pelan & ramah balita
        utterance.pitch = 1.25; // Nada riang & manis
        window.speechSynthesis.speak(utterance);
      } else {
        playTone(550, 'sine', 0.2);
      }
    }

    // Eja suku kata perlahan dengan jeda koma (contoh: "K-U... C-I-N-G")
    function spellSyllables(syllables, fullWord) {
      const textToSpell = `${syllables.join('... ')}... ${fullWord}!`;
      speakWord(textToSpell, 0.55); // Rate 0.55 ekstra lambat untuk mengeja
    }

       ========================================================================= */
    let mediaRecorder = null;
    let audioChunks = [];
    let recordedAudioUrl = null;
    let isRecording = false;

    async function toggleVoiceRecord() {
      const btn = document.getElementById('recordBtn');
      const statusText = document.getElementById('recordStatus');
      const playBtnWrap = document.getElementById('playRecordedBtn');

      if (!isRecording) {
        // Mulai Merekam
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            recordedAudioUrl = URL.createObjectURL(audioBlob);
            if (playBtnWrap) playBtnWrap.classList.remove('hidden');
          };

          mediaRecorder.start();
          isRecording = true;
          btn.classList.add('recording-pulse', 'bg-red-500');
          btn.classList.remove('bg-amber-500');
          statusText.innerText = "Sedang Merekam... Ayo Bicara!";
          playTone(600, 'sine', 0.15);
        } catch (err) {
          console.warn("Mikrofon tidak diizinkan atau tidak tersedia:", err);
          showToast("Izin mikrofon diperlukan ya!");
        }
      } else {
        // Hentikan Merekam
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
          mediaRecorder.stream.getTracks().forEach(track => track.stop());
        }
        isRecording = false;
        btn.classList.remove('recording-pulse', 'bg-red-500');
        btn.classList.add('bg-amber-500');
        statusText.innerText = "Rekaman selesai! Dengarkan yuk 👇";
        playRewardJingle();
      }
    }

    function playRecordedVoice(pitchShift = 1.0) {

      audio.play();
    }

    /* =========================================================================
       6. INTERACTIVE OFFLINE CANVAS VIDEO ENGINE (BANYAK FITUR BARU)
       ========================================================================= */
    let canvasAnimationId = null;
    let canvasState = {
      sunY: 45,
      carX: -80,
      carSpeed: 2,
      isNight: false,
      isRaining: false,
      hasRainbow: false,
      starsCollected: 0,
      balloonY: -100,
      balloonX: 120,
      raindrops: [],
      particles: [],
      birds: []
    };

    function initInteractiveVideo() {
      const canvas = document.getElementById('interactiveCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      // Set internal resolution
      canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      const renderWidth = canvas.parentElement.clientWidth;
      const renderHeight = canvas.parentElement.clientHeight;

      // Inisialisasi Tetes Hujan
      canvasState.raindrops = [];
      for (let i = 0; i < 40; i++) {
        canvasState.raindrops.push({
          x: Math.random() * renderWidth,
          y: Math.random() * renderHeight,
          speed: 4 + Math.random() * 4
        });
      }

      // Event Sentuhan Canvas Langsung
      canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const touchX = e.clientX - rect.left;
        const touchY = e.clientY - rect.top;

        // Sentuh area matahari / bulan
        if (touchX < 80 && touchY < 80) {
          playTone(880, 'sine', 0.2);
          canvasState.sunY = 30;
          setTimeout(() => canvasState.sunY = 45, 300);
          addCanvasStars(touchX, touchY);
          speakWord(canvasState.isNight ? "Bulan Malam Indah!" : "Matahari Ceria!");
        } 
        // Sentuh mobil
        else if (touchY > renderHeight - 90 && touchY < renderHeight - 20) {
          playVehicleSound('car');
          boostCar();
          addCanvasStars(touchX, touchY);
        } else {
          playTone(660, 'triangle', 0.15);
          addCanvasStars(touchX, touchY);
        }
      };

      function drawScene() {
        ctx.clearRect(0, 0, renderWidth, renderHeight);

        // Langit (Siang, Hujan, atau Malam)
        if (canvasState.isNight) {
          ctx.fillStyle = '#0F172A'; // Langit malam pekat
        } else if (canvasState.isRaining) {
          ctx.fillStyle = '#94A3B8'; // Langit kelabu mendung
        } else {
          ctx.fillStyle = '#7DD3FC'; // Langit biru cerah
        }
        ctx.fillRect(0, 0, renderWidth, renderHeight);

        // Bintang malam kelap-kelip jika malam hari
        if (canvasState.isNight) {
          ctx.fillStyle = '#FDE047';
          for (let i = 0; i < 20; i++) {
            const bx = (i * 37) % renderWidth;
            const by = (i * 23) % (renderHeight / 2);
            ctx.fillRect(bx, by, 2, 2);
          }
        }

        // Pelangi jika aktif
        if (canvasState.hasRainbow) {
          const colors = ['#EF4444', '#F97316', '#FBBF24', '#10B981', '#3B82F6', '#8B5CF6'];
          colors.forEach((c, idx) => {
            ctx.beginPath();
            ctx.arc(renderWidth / 2, renderHeight - 30, 110 - idx * 6, Math.PI, 0);
            ctx.strokeStyle = c;
            ctx.lineWidth = 5;
            ctx.stroke();
          });
        }

        // Matahari (Siang) atau Bulan Sabit (Malam)
        if (canvasState.isNight) {
          // Bulan Sabit
          ctx.beginPath();
          ctx.arc(45, canvasState.sunY, 22, 0, Math.PI * 2);
          ctx.fillStyle = '#FDE047';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(52, canvasState.sunY - 4, 18, 0, Math.PI * 2);
          ctx.fillStyle = '#0F172A';
          ctx.fill();
        } else {
          // Matahari Kartun Tersenyum
          ctx.beginPath();
          ctx.arc(45, canvasState.sunY, 26, 0, Math.PI * 2);
          ctx.fillStyle = '#FBBF24';
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#F59E0B';
          ctx.stroke();
          ctx.fillStyle = '#78350F';
          ctx.beginPath();
          ctx.arc(38, canvasState.sunY - 4, 3, 0, Math.PI * 2);
          ctx.arc(52, canvasState.sunY - 4, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(45, canvasState.sunY + 4, 8, 0, Math.PI);
          ctx.stroke();
        }

        // Balon Udara jika terbang
        if (canvasState.balloonY > -80 && canvasState.balloonY < renderHeight + 60) {
          canvasState.balloonY += 0.8;
          ctx.fillStyle = '#EC4899';
          ctx.beginPath();
          ctx.arc(canvasState.balloonX, canvasState.balloonY, 20, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#831843';
          ctx.fillRect(canvasState.balloonX - 5, canvasState.balloonY + 24, 10, 8);
        }

        // Bukit Rumput
        ctx.beginPath();
        ctx.ellipse(renderWidth * 0.3, renderHeight - 20, renderWidth * 0.6, 60, 0, 0, Math.PI * 2);
        ctx.fillStyle = canvasState.isNight ? '#1E3A1E' : '#4ADE80';
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(renderWidth * 0.8, renderHeight - 15, renderWidth * 0.5, 50, 0, 0, Math.PI * 2);
        ctx.fillStyle = canvasState.isNight ? '#142E14' : '#22C55E';
        ctx.fill();

        // Kucing Ceria di Pinggir Jalan
        ctx.font = '24px serif';
        ctx.fillText('🐱', renderWidth * 0.82, renderHeight - 50);

        // Jalan Raya
        ctx.fillStyle = '#475569';
        ctx.fillRect(0, renderHeight - 45, renderWidth, 45);
        ctx.fillStyle = '#F8FAFC';
        for (let x = 10; x < renderWidth; x += 40) {
          ctx.fillRect(x, renderHeight - 24, 20, 4);
        }

        // Hujan jika aktif
        if (canvasState.isRaining) {
          ctx.strokeStyle = '#E0F2FE';
          ctx.lineWidth = 2;
          canvasState.raindrops.forEach(drop => {
            ctx.beginPath();
            ctx.moveTo(drop.x, drop.y);
            ctx.lineTo(drop.x - 2, drop.y + 10);
            ctx.stroke();
            drop.y += drop.speed;
            if (drop.y > renderHeight) drop.y = -10;
          });
        }

        // Mobil Kartun Bergerak
        canvasState.carX += canvasState.carSpeed;
        if (canvasState.carX > renderWidth + 40) {
          canvasState.carX = -70;
        }

        const cx = canvasState.carX;
        const cy = renderHeight - 50;

        // Badan Mobil
        ctx.fillStyle = '#EF4444';
        ctx.beginPath();
        ctx.roundRect(cx, cy, 60, 24, 8);
        ctx.fill();

        // Kabin Mobil
        ctx.fillStyle = '#F87171';
        ctx.beginPath();
        ctx.roundRect(cx + 12, cy - 14, 34, 16, 5);
        ctx.fill();

        // Kaca
        ctx.fillStyle = '#E0F2FE';
        ctx.fillRect(cx + 16, cy - 10, 12, 10);
        ctx.fillRect(cx + 30, cy - 10, 12, 10);

        // Lampu depan mobil saat malam
        if (canvasState.isNight) {
          ctx.fillStyle = 'rgba(253, 224, 71, 0.45)';
          ctx.beginPath();
          ctx.moveTo(cx + 60, cy + 8);
          ctx.lineTo(cx + 120, cy - 5);
          ctx.lineTo(cx + 120, cy + 25);
          ctx.closePath();
          ctx.fill();
        }

        // Roda
        ctx.fillStyle = '#1E293B';
        ctx.beginPath();
        ctx.arc(cx + 14, cy + 24, 8, 0, Math.PI * 2);
        ctx.arc(cx + 46, cy + 24, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#CBD5E1';
        ctx.beginPath();
        ctx.arc(cx + 14, cy + 24, 3, 0, Math.PI * 2);
        ctx.arc(cx + 46, cy + 24, 3, 0, Math.PI * 2);
        ctx.fill();

        // Partikel Kembang Api & Sentuhan
        for (let i = canvasState.particles.length - 1; i >= 0; i--) {
          const p = canvasState.particles[i];
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          p.x += p.vx;
          p.y += p.vy;
          p.size *= 0.94;
          if (p.size < 0.5) canvasState.particles.splice(i, 1);
        }

        canvasAnimationId = requestAnimationFrame(drawScene);
      }

      drawScene();
    }

    function stopInteractiveVideo() {
      if (canvasAnimationId) {
        cancelAnimationFrame(canvasAnimationId);
        canvasAnimationId = null;
      }
    }

    function toggleDayNight() {
      canvasState.isNight = !canvasState.isNight;
      playTone(canvasState.isNight ? 280 : 620, 'sine', 0.25);
      speakWord(canvasState.isNight ? "Malam hari yang tenang..." : "Siang hari yang ceria!");
    }

    function triggerRain() {
      canvasState.isRaining = !canvasState.isRaining;
      if (canvasState.isRaining) {
        playTone(300, 'sawtooth', 0.4);
        speakWord("Hujan turun, tik tik tik!");
      }
    }

    function triggerRainbow() {
      canvasState.hasRainbow = !canvasState.hasRainbow;
      if (canvasState.hasRainbow) {
        playRewardJingle();
        speakWord("Pelangi indah muncul!");
      }
    }

    function boostCar() {
      canvasState.carSpeed = 6;
      playVehicleSound('car');
      setTimeout(() => canvasState.carSpeed = 2, 2200);
    }

    function spawnFireworks() {
      playRewardJingle();
      speakWord("Wah, kembang api meriah!");
      const colors = ['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#EC4899', '#8B5CF6'];
      for (let i = 0; i < 35; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        canvasState.particles.push({
          x: 180,
          y: 80,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 6 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function spawnHotAirBalloon() {
      playTone(550, 'sine', 0.2);
      speakWord("Balon udara terbang!");
      canvasState.balloonY = -20;
    }

    function addCanvasStars(x, y) {
      canvasState.starsCollected += 1;
      const scoreBadge = document.getElementById('canvasScore');
      if (scoreBadge) scoreBadge.innerText = `Bintang: ${canvasState.starsCollected} ⭐`;

      const colors = ['#FBBF24', '#F472B6', '#60A5FA', '#34D399'];
      for (let i = 0; i < 10; i++) {
        canvasState.particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          size: 6 + Math.random() * 4,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function resetInteractiveVideo() {
      canvasState.carX = -70;
      canvasState.carSpeed = 2;
      canvasState.isNight = false;
      canvasState.isRaining = false;
      canvasState.hasRainbow = false;
      canvasState.balloonY = -100;
      canvasState.particles = [];
      playTone(400, 'sine', 0.2);
    }

    // Initialize Default View
    window.onload = () => {
      switchView('home');
    };
  </script>
</body>
</html>
