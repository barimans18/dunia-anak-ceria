<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- Latar Belakang Kotak Berbucu Bulat -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Elemen Awan Hiasan Belakang -->
  <path d="M120 380 C110 380 95 370 95 350 C95 330 115 320 130 320 C140 295 175 295 190 320 C205 320 220 335 220 350 C220 370 205 380 185 380 Z" fill="url(#cloudGrad)" opacity="0.8" />
  <path d="M340 180 C330 180 320 170 320 155 C320 140 335 130 348 130 C355 110 385 110 398 130 C410 130 422 142 422 155 C422 170 410 180 395 180 Z" fill="url(#cloudGrad)" opacity="0.8" />

  <!-- Karakter Beruang / Kucing Ceria Comel -->
  <g transform="translate(136, 140)">
    <!-- Telinga Kiri & Kanan -->
    <ellipse cx="45" cy="40" rx="35" ry="40" fill="#F97316" />
    <ellipse cx="45" cy="40" rx="20" ry="24" fill="#FED7AA" />
    <ellipse cx="195" cy="40" rx="35" ry="40" fill="#F97316" />
    <ellipse cx="195" cy="40" rx="20" ry="24" fill="#FED7AA" />

    <!-- Kepala Utama -->
    <ellipse cx="120" cy="130" rx="110" ry="95" fill="#FB923C" />
    <!-- Pipi Merah (Blush) -->
    <ellipse cx="45" cy="155" rx="16" ry="10" fill="#FDA4AF" opacity="0.8" />
    <ellipse cx="195" cy="155" rx="16" ry="10" fill="#FDA4AF" opacity="0.8" />

    <!-- Mata Berbinar -->
    <ellipse cx="80" cy="120" rx="14" ry="18" fill="#1E293B" />
    <circle cx="75" cy="112" r="5" fill="#FFFFFF" />
    <circle cx="85" cy="125" r="2.5" fill="#FFFFFF" />

    <ellipse cx="160" cy="120" rx="14" ry="18" fill="#1E293B" />
    <circle cx="155" cy="112" r="5" fill="#FFFFFF" />
    <circle cx="165" cy="125" r="2.5" fill="#FFFFFF" />

    <!-- Muncung & Mulut Senyum -->
    <ellipse cx="120" cy="150" rx="36" ry="26" fill="#FFF7ED" />
    <polygon points="120,140 110,148 130,148" fill="#C2410C" />
    <path d="M110 154 Q120 164 120 154 Q120 164 130 154" stroke="#C2410C" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Bintang Magik Hadapan -->
  <polygon points="390,320 402,348 432,350 408,370 416,398 390,382 364,398 372,370 348,350 378,348" fill="url(#starGrad)" />
</svg>